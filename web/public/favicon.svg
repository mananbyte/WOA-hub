  <rect width="48" height="48" rx="10" fill="#141A1F"/>
  <!-- Cobalt outer ring -->
  <circle cx="24" cy="24" r="21" stroke="#1240C7" stroke-width="1.5" fill="none"/>
  <!-- Inner accent ring -->
  <circle cx="24" cy="24" r="17" stroke="#1240C7" stroke-width="0.5" fill="none" opacity="0.4"/>
  <!-- Aircraft silhouette — angled departure -->
  <path d="M13 28 L29 17 L35 19 L29 22 L33 30 L29 28.5 L27 24 L19 26 L21 30 L17 29 Z" fill="#1240C7"/>
