  <line x1="11" y1="26" x2="6" y2="27.5" stroke="#A8C229" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="29" x2="5" y2="31" stroke="#A8C229" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="11" y1="32" x2="7" y2="34" stroke="#A8C229" stroke-width="0.75" stroke-linecap="round" opacity="0.4"/>
  <!-- Lime nav dot -->
