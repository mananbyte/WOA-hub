services:
  postgres:
    image: postgres:16-alpine
    container_name: woa_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-woa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-woa_secure_password_replace_me}
      POSTGRES_DB: ${POSTGRES_DB:-woa_hub}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-woa_admin} -d ${POSTGRES_DB:-woa_hub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: woa_app_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-woa_admin}:${POSTGRES_PASSWORD:-woa_secure_password_replace_me}@postgres:5432/${POSTGRES_DB:-woa_hub}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-replace-in-production-min-32-chars}

volumes:
  postgres_prod_data:
